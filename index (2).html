<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo — Scheduling and Event Reminder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Tempo%20-%20Scheduling%20and%20Event%20Reminder%22%2C%22short_name%22%3A%22Tempo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ececec%22%2C%22theme_color%22%3A%22%23202020%22%7D">
<style>
:root{
  --bg:#ececec;--panel:#fff;--border:#d7d7d7;--text:#202020;--muted:#777;--sidebar:#171717;--accent:#202020;
  --input-bg:#fff;--input-border:#ccc;--secondary-bg:#f5f5f5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151515;--panel:#1f1f1f;--border:#333;--text:#eee;--muted:#999;--sidebar:#0d0d0d;--accent:#e8e8e8;
    --input-bg:#252525;--input-border:#444;--secondary-bg:#2a2a2a;
  }
}
:root[data-theme="dark"]{
  --bg:#151515;--panel:#1f1f1f;--border:#333;--text:#eee;--muted:#999;--sidebar:#0d0d0d;--accent:#e8e8e8;
  --input-bg:#252525;--input-border:#444;--secondary-bg:#2a2a2a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--sidebar);color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;z-index:5;overflow-y:auto}
.brand{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:28px}
.nav button{display:block;width:100%;padding:12px 14px;margin:6px 0;border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left}
.nav button:hover,.nav button.active{background:#303030;color:#fff}
.back{margin-top:25px!important;border-top:1px solid #333!important;border-radius:0!important}
.main{margin-left:220px;min-height:100vh;padding:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
h1,h2,h3,p{margin-top:0}.topbar h1{margin-bottom:7px}.topbar p{color:var(--muted);max-width:760px;line-height:1.5}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--bg);font-size:25px;flex-shrink:0}
.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 2px 7px #0000000b}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.class-grid,.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.class-card,.subject-card{cursor:pointer;transition:.15s}.class-card:hover,.subject-card:hover{transform:translateY(-2px);box-shadow:0 5px 16px #0002}
.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--input-border);border-radius:7px;background:var(--input-bg)}
textarea{min-height:90px;resize:vertical}
.primary{border:0;background:var(--accent);color:var(--bg);padding:11px 16px;border-radius:7px}
.secondary{border:1px solid var(--input-border);background:var(--secondary-bg);padding:10px 15px;border-radius:7px}
.row{display:flex;gap:10px;align-items:center}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dynamic{margin-top:10px}.dynamic-row{display:grid;grid-template-columns:1fr 42px;gap:8px;margin:7px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.week,.day{padding:10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:64px}
.week{min-height:auto;background:var(--secondary-bg);font-weight:bold;text-align:center;font-size:12px}
.day{background:var(--panel);cursor:pointer}.day:hover{background:var(--secondary-bg)}
.day.selected{outline:2px solid var(--accent);outline-offset:-2px}.day.has-items{background:var(--secondary-bg)}
.day-num{font-weight:bold;font-size:13px}
.badge{display:inline-block;margin-top:6px;background:var(--accent);color:var(--bg);padding:3px 6px;border-radius:10px;font-size:10px}
.folder-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.folder-add{position:relative}
.add-menu{position:absolute;right:0;top:42px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 5px 20px #0004;min-width:150px;z-index:10}
.add-menu button{display:block;width:100%;border:0;background:var(--panel);padding:10px;text-align:left}
.add-menu button:hover{background:var(--secondary-bg)}
.item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.item:last-child{border-bottom:0}.item-main{flex:1;min-width:150px}
.type{font-size:11px;font-weight:bold;text-transform:uppercase;color:var(--muted)}
.item img{width:70px;height:70px;object-fit:cover;border-radius:7px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:600px){.info-grid{grid-template-columns:1fr}}
.info-box{background:var(--secondary-bg);padding:15px;border-radius:8px}
.teacher-list,.subject-list{margin:0;padding-left:20px;line-height:1.8}
.subject-detail{margin-top:18px}
.event-table{width:100%;border-collapse:collapse}
.event-table th,.event-table td{text-align:left;padding:11px;border-bottom:1px solid var(--border);vertical-align:top}
.event-table th{background:var(--secondary-bg);font-size:13px}
.table-wrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-box{background:var(--panel);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:22px}
.toast{position:fixed;right:25px;bottom:calc(25px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);padding:12px 16px;border-radius:8px;display:none;z-index:50}
@media(max-width:800px){.sidebar{width:180px}.main{margin-left:180px;padding:18px}.week,.day{padding:6px;min-height:52px;font-size:11px}}
@media(max-width:560px){
  .sidebar{position:static;width:100%;padding:16px;display:flex;align-items:center;justify-content:space-between}
  .brand{margin-bottom:0;font-size:16px}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .nav button{width:auto;margin:0;padding:8px 10px;font-size:12px}
  .main{margin-left:0;padding:16px}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">Tempo<br><span style="font-weight:400;font-size:13px;opacity:.7">Scheduling &amp; Event Reminder</span></div>
  <div id="nav" class="nav"></div>
</aside>

<main class="main">
  <div id="app"></div>
</main>
<div id="toast" class="toast"></div>

<script>
const STORE_KEY="scheduler_classrooms_v1";
let classrooms=JSON.parse(localStorage.getItem(STORE_KEY)||"[]");
let currentClassroom=null;
let page="dashboard";
let selectedDate=new Date().toISOString().slice(0,10);
let calendarDate=new Date();
let selectedSubject=null;
let itemType="event";
let nextId=Math.max(0,...classrooms.map(c=>c.id||0),...classrooms.flatMap(c=>(c.items||[]).map(i=>i.id||0)),...classrooms.flatMap(c=>(c.subjects||[]).map(s=>s.id||0)))+1;

const app=document.getElementById("app");
const nav=document.getElementById("nav");

function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(classrooms));}
  catch(e){alert("Storage is full. Try removing some pictures or items.");}
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function navRender(){
  if(!currentClassroom){
    nav.innerHTML=`<button class="${page==="dashboard"?"active":""}" onclick="showDashboard()">Dashboard</button>
    <button class="${page==="calendar"?"active":""}" onclick="showGlobalCalendar()">Calendar</button>`;
  }else{
    nav.innerHTML=`<button class="${page==="main"?"active":""}" onclick="showClassMain()">Main UI</button>
    <button class="${page==="institutes"?"active":""}" onclick="showInstitutes()">View Institutes</button>
    <button class="${page==="subjects"?"active":""}" onclick="showSubjects()">Subjects</button>
    <button class="back" onclick="leaveClass()">← Back to Dashboard</button>`;
  }
}
function render(){navRender();if(page==="dashboard")dashboard();else if(page==="calendar")globalCalendar();else if(page==="main")classMain();else if(page==="institutes")institutes();else if(page==="subjects")subjects()}

function showDashboard(){currentClassroom=null;page="dashboard";render()}
function showGlobalCalendar(){currentClassroom=null;page="calendar";render()}
function openClass(id){currentClassroom=classrooms.find(c=>c.id===id);page="main";calendarDate=new Date();selectedDate=new Date().toISOString().slice(0,10);render()}
function leaveClass(){currentClassroom=null;page="dashboard";render()}
function showClassMain(){page="main";render()} function showInstitutes(){page="institutes";render()} function showSubjects(){page="subjects";selectedSubject=null;render()}

function dashboard(){
 app.innerHTML=`<div class="topbar"><div><h1>Scheduling and Event Reminder</h1><p>Organize classroom schedules, activities, events, subjects, and teacher information in one simple system, saved right on this device.</p></div><button class="plus" onclick="openClassroomModal()">+</button></div>
 <div class="panel"><div class="toolbar"><div><h2>Classrooms</h2><p class="muted small">Saved on this device — works offline.</p></div></div>
 <div class="class-grid">${classrooms.length?classrooms.map(c=>`<div class="card class-card" onclick="openClass(${c.id})"><h3>${esc(c.name)}</h3><p class="muted">${c.studentCount} students</p><p>${esc(c.description||"No description.")}</p><p class="small"><b>Main Adviser:</b> ${esc(c.mainAdviser||"Not assigned")}</p><p class="small"><b>Subjects:</b> ${c.subjects.length}</p></div>`).join(""):`<div class="card"><p>No classrooms yet. Tap <b>+</b> to create one.</p></div>`}</div></div>`;
}

function openClassroomModal(){
 app.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="toolbar"><h2>Create Classroom</h2><button class="secondary" onclick="closeModal()">Close</button></div>
 <form onsubmit="createClassroom(event)"><div class="form-grid">
 <div><label>Classroom / Section Name</label><input name="name" required placeholder="e.g. Grade 12 - ICT A"></div>
 <div><label>Number of Students</label><input name="students" type="number" min="0" value="30"></div>
 <div><label>Main Adviser</label><input name="adviser" placeholder="Teacher name"></div>
 <div><label>Classroom Description</label><input name="description" placeholder="Short description"></div>
 <div class="full"><label>Sub Teachers</label><div id="teachers" class="dynamic"></div><button type="button" class="secondary" onclick="addTeacher()">+ Add Teacher</button></div>
 <div class="full"><label>Subjects</label><div id="subjects" class="dynamic"></div><button type="button" class="secondary" onclick="addSubject()">+ Add Subject</button></div>
 </div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Create Classroom</button></div></form></div></div>`);
 addTeacher();addSubject();
}
function closeModal(){document.getElementById("modal")?.remove()}
function addTeacher(){document.getElementById("teachers").insertAdjacentHTML("beforeend",`<div class="dynamic-row"><input class="teacher-input" placeholder="Sub teacher name"><button type="button" class="secondary" onclick="this.parentElement.remove()">×</button></div>`)}
function addSubject(){document.getElementById("subjects").insertAdjacentHTML("beforeend",`<div class="card" style="margin:8px 0"><div class="form-grid"><input class="subject-name" placeholder="Subject name"><input class="subject-teacher" placeholder="Teacher"><textarea class="subject-description full" placeholder="Subject description"></textarea></div><button type="button" class="secondary" onclick="this.parentElement.remove()">Remove</button></div>`)}

function createClassroom(e){
 e.preventDefault();const f=e.target;
 const teachers=[...document.querySelectorAll(".teacher-input")].map(x=>x.value.trim()).filter(Boolean).map(name=>({id:nextId++,name,role:"Sub Teacher"}));
 const adviser=f.adviser.value.trim();
 if(adviser)teachers.unshift({id:nextId++,name:adviser,role:"Main Adviser"});
 const subjects=[...document.querySelectorAll("#subjects .card")].map(x=>({id:nextId++,name:x.querySelector(".subject-name").value.trim(),teacher:x.querySelector(".subject-teacher").value.trim(),description:x.querySelector(".subject-description").value.trim()})).filter(x=>x.name);
 if(!f.name.value.trim()){alert("Classroom name is required.");return}
 const c={id:nextId++,name:f.name.value.trim(),studentCount:Math.max(0,Number(f.students.value||0)),mainAdviser:adviser,description:f.description.value.trim(),subTeachers:teachers,subjects,items:[]};
 classrooms.unshift(c);save();closeModal();toast("Classroom saved");openClass(c.id);
}

function monthTitle(d){return d.toLocaleString("en-US",{month:"long",year:"numeric"})}
function moveMonth(delta){calendarDate.setMonth(calendarDate.getMonth()+delta);render()}
function calendarHtml(items, onSelect="selectDate"){
 const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="week">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+=`<div class="day"></div>`;
 for(let d=1;d<=days;d++){const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,count=items.filter(x=>x.item_date===date).length;h+=`<div class="day ${date===selectedDate?"selected":""} ${count?"has-items":""}" onclick="${onSelect}('${date}')"><div class="day-num">${d}</div>${count?`<span class="badge">${count} item${count>1?"s":""}</span>`:""}</div>`}
 return h;
}
function selectDate(date){selectedDate=date;render()}
function classMain(){
 const items=currentClassroom.items||[];
 app.innerHTML=`<div class="topbar"><div><h1>${esc(currentClassroom.name)}</h1><p class="muted">Classroom Main UI</p></div></div>
 <div class="panel"><div class="toolbar"><h2>${monthTitle(calendarDate)}</h2><div class="row"><button class="secondary" onclick="moveMonth(-1)">‹</button><button class="secondary" onclick="moveMonth(1)">›</button></div></div><div class="calendar">${calendarHtml(items)}</div></div>
 <div class="panel" style="margin-top:18px"><div class="folder-head"><div><h2>Folder</h2><p class="muted small">Items for ${selectedDate}</p></div><div class="folder-add"><button class="plus" onclick="toggleAddMenu()">+</button><div id="addMenu" class="add-menu hidden"><button onclick="openItemModal('event')">Add Events</button><button onclick="openItemModal('activity')">Add Activities</button></div></div></div>
 <div>${items.filter(x=>x.item_date===selectedDate).length?items.filter(x=>x.item_date===selectedDate).map(itemHtml).join(""):`<p class="muted">No events or activities for this date.</p>`}</div></div>`;
}
function toggleAddMenu(){document.getElementById("addMenu")?.classList.toggle("hidden")}
function itemHtml(i){return `<div class="item"><div class="item-main"><div class="type">${esc(i.item_type)}</div><b>${esc(i.subject||"General")}</b><p>${esc(i.details)}</p><span class="small muted">Published by ${esc(i.publisher||"Unknown")}</span></div>${i.picture?`<img src="${i.picture}">`:""}<button class="secondary" onclick="deleteItem(${i.id})">Delete</button></div>`}

function openItemModal(type){
 itemType=type;document.getElementById("addMenu")?.classList.add("hidden");
 app.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modal-box"><div class="toolbar"><h2>Add ${type==="event"?"Event":"Activity"}</h2><button class="secondary" onclick="closeModal()">Close</button></div>
 <form onsubmit="submitItem(event)"><div class="form-grid"><div><label>Date</label><input name="date" type="date" value="${selectedDate}" required></div>
 <div><label>Subject</label><select name="subjectId"><option value="">General</option>${currentClassroom.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
 <div><label>Publisher</label><input name="publisher" placeholder="Name"></div><div><label>Picture (optional)</label><input name="picture" type="file" accept="image/*"></div>
 <div class="full"><label>Details</label><textarea name="details" required placeholder="Enter event/activity details"></textarea></div></div>
 <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save ${type}</button></div></form></div></div>`);
}
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function submitItem(e){
 e.preventDefault();const f=e.target;
 const subjectId=f.subjectId.value?Number(f.subjectId.value):null;
 const subj=currentClassroom.subjects.find(s=>s.id===subjectId);
 let picture=null;
 if(f.picture.files[0]){
   try{picture=await fileToDataUrl(f.picture.files[0]);}
   catch(err){alert("Could not read the picture file.");return}
 }
 const item={id:nextId++,item_date:f.date.value,item_type:itemType,details:f.details.value.trim(),publisher:f.publisher.value.trim(),picture,subject_id:subjectId,subject:subj?subj.name:null};
 if(!item.item_date||!item.details){alert("Date and details are required.");return}
 currentClassroom.items.push(item);save();selectedDate=f.date.value;closeModal();toast("Saved");render();
}
function deleteItem(id){
 if(!confirm("Delete this item?"))return;
 currentClassroom.items=currentClassroom.items.filter(i=>i.id!==id);
 save();toast("Item deleted");render();
}

function globalCalendar(){
 app.innerHTML=`<div class="topbar"><div><h1>Calendar</h1><p class="muted">Overview of saved dates across your classrooms.</p></div></div><div class="panel"><div class="toolbar"><h2>${monthTitle(calendarDate)}</h2><div class="row"><button class="secondary" onclick="moveMonth(-1)">‹</button><button class="secondary" onclick="moveMonth(1)">›</button></div></div><div class="calendar">${calendarHtml(classrooms.flatMap(c=>c.items||[]),"globalDate")}</div></div>`;
}
function globalDate(date){selectedDate=date;alert("Select a classroom from Dashboard to view this date's folder.")}

function institutes(){
 app.innerHTML=`<div class="topbar"><div><h1>View Institutes</h1><p class="muted">Classroom and teacher information.</p></div></div>
 <div class="panel"><h2>${esc(currentClassroom.name)}</h2><p>${esc(currentClassroom.description||"No classroom description.")}</p><div class="info-grid"><div class="info-box"><b>Students</b><div>${currentClassroom.studentCount}</div></div><div class="info-box"><b>Main Adviser</b><div>${esc(currentClassroom.mainAdviser||"Not assigned")}</div></div><div class="info-box"><b>Subjects</b><div>${currentClassroom.subjects.length}</div></div></div>
 <h3 style="margin-top:25px">Teachers</h3><ul class="teacher-list">${currentClassroom.subTeachers.map(t=>`<li>${esc(t.name)} — ${esc(t.role)}</li>`).join("")||"<li>No teachers listed.</li>"}</ul>
 <h3>Subjects and Teachers</h3><ul class="subject-list">${currentClassroom.subjects.map(s=>`<li><b>${esc(s.name)}</b> — ${esc(s.teacher||"No teacher assigned")}<br><span class="muted">${esc(s.description||"")}</span></li>`).join("")||"<li>No subjects.</li>"}</ul></div>`;
}
function subjects(){
 if(selectedSubject){subjectDetail();return}
 app.innerHTML=`<div class="topbar"><div><h1>Subjects</h1><p class="muted">Select a subject to view its events and activities.</p></div></div><div class="subject-grid">${currentClassroom.subjects.map(s=>`<div class="card subject-card" onclick="selectedSubject=${s.id};render()"><h3>${esc(s.name)}</h3><p><b>Teacher:</b> ${esc(s.teacher||"Not assigned")}</p><p class="muted">${esc(s.description||"No description.")}</p></div>`).join("")||`<div class="card">No subjects created.</div>`}</div>`;
}
function subjectDetail(){
 const s=currentClassroom.subjects.find(x=>x.id===selectedSubject),items=currentClassroom.items.filter(i=>i.subject_id===s.id);
 app.innerHTML=`<div class="topbar"><div><h1>${esc(s.name)}</h1><p class="muted">Teacher: ${esc(s.teacher||"Not assigned")}</p></div><button class="secondary" onclick="selectedSubject=null;render()">← Subjects</button></div><div class="panel"><h3>Description</h3><p>${esc(s.description||"No description.")}</p><h3 style="margin-top:25px">Activities and Events</h3>${items.length?`<div class="table-wrap"><table class="event-table"><thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Publisher</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.item_date)}</td><td>${esc(i.item_type)}</td><td>${esc(i.details)}</td><td>${esc(i.publisher||"—")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No events or activities have been added for this subject.</p>`}</div>`;
}

render();
</script>
</body>
</html>
